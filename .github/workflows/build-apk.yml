name: Build Debug APK

on:
  push:
    branches:
      - feat/driving-bypass
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (required by this project's Gradle config)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Cache Gradle dependencies for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Grant execute permission to gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # 6. Upload APK as a downloadable artifact (available for 7 days)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AABrowser-driving-bypass-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 7. Print APK info
      - name: Show APK info
        run: |
          echo "✅ Build complete!"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
